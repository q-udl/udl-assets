name: Flutter Web checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: flutter create . --platforms web
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Render and check BAST / BA photo appendices
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null; then
            echo "::warning::Poppler tools unavailable; PDF visual QA must be done manually."
            exit 0
          fi
          mkdir -p build/rv030-pdf-qa/render
          for file in build/rv030-pdf-qa/*.pdf; do
            test -f "$file"
            pages=$(pdfinfo "$file" | awk '/^Pages:/ {print $2}')
            echo "$file -> $pages pages"
            test "$pages" -ge 2
            if pdftotext -f 1 -l 1 "$file" - | grep -qi 'LAMPIRAN FOTO BUKTI'; then
              echo "Appendix heading incorrectly displayed on page 1: $file"
              exit 1
            fi
            pdftotext "$file" - | grep -qi 'LAMPIRAN FOTO BUKTI'
            if [[ "$(basename "$file")" == BAST-* ]]; then
              textfile="build/rv030-pdf-qa/render/BAST-contents.txt"
              pdftotext -layout "$file" "$textfile"
              grep -qi 'Nomor BAST' "$textfile"
              grep -qi 'Referensi Penugasan' "$textfile"
              grep -qi 'Tanggal Serah Terima' "$textfile"
              grep -qi 'Lokasi Serah Terima' "$textfile"
              grep -qi 'PARA PIHAK' "$textfile"
              grep -qi 'Penyerah' "$textfile"
              grep -qi 'Penerima' "$textfile"
              grep -qi 'PERNYATAAN SERAH TERIMA' "$textfile"
              if grep -Eqi 'DRAF - TANDA|Nomor dokumen resmi:|Status sistem|Tanda tangan:' "$textfile"; then
                echo "BAST contains a retired draft label or signature guide"
                exit 1
              fi
            fi
            pdftoppm -f 1 -l 3 -png -r 115 "$file"               "build/rv030-pdf-qa/render/$(basename "$file" .pdf)"
          done
      - name: Preserve RV030 PDF visual QA
        uses: actions/upload-artifact@v4
        with:
          name: udl-assets-rv030-pdf-qa
          path: build/rv030-pdf-qa/
          if-no-files-found: warn
          retention-days: 10
      - name: Build Flutter Web
        run: flutter build web --release

      - name: Preserve local web preview
        uses: actions/upload-artifact@v4
        with:
          name: udl-assets-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 5

      - name: Assemble isolated Windows UAT one-click package
        run: |
          mkdir -p build/udl-assets-uat-windows-rv030/web
          cp -a build/web/. build/udl-assets-uat-windows-rv030/web/
          cp uat/windows/JALANKAN-UDL-ASSETS.cmd build/udl-assets-uat-windows-rv030/
          cp uat/windows/start-uat.ps1 build/udl-assets-uat-windows-rv030/
          cp uat/windows/README.md build/udl-assets-uat-windows-rv030/
      - name: Preserve Windows UAT package (no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: udl-assets-uat-windows-rv030
          path: build/udl-assets-uat-windows-rv030/
          if-no-files-found: error
          retention-days: 10

      - name: Capture responsive previews (if browser available)
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Headless Chrome is not installed; screenshot skipped."
            exit 0
          fi
          python3 -m http.server 8765 --directory build/web --bind 127.0.0.1 >/tmp/udl-assets-local-web.log 2>&1 &
          sleep 2
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=10000 --screenshot=dashboard-smoke.png http://127.0.0.1:8765/ || true
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 --screenshot=mobile-width-smoke.png http://127.0.0.1:8765/ || true
      - name: Upload dashboard screenshot
        uses: actions/upload-artifact@v4
        with:
          name: udl-assets-dashboard-screenshot
          path: |
            dashboard-smoke.png
            mobile-width-smoke.png
          if-no-files-found: warn
          retention-days: 5
