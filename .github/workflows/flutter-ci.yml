name: Flutter Web checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: flutter create . --platforms web
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build Flutter Web
        run: flutter build web --release
